server.port=5000
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/approval_db};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=60m

# Bounded Tomcat threads so concurrent approvals degrade gracefully.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Template caching ON by default (was false). Override with the 'dev' profile if needed.
spring.thymeleaf.cache=true

# F2 FIX: default points at the API's real port (9999), not 8767.
vcard.api.base=${VCARD_API_BASE:http://localhost:9999}
vcard.api.email=${VCARD_API_EMAIL:admin@afrilandfirstbank.com}
vcard.api.password=${VCARD_API_PASS:admin}
vcard.front.url=${VCARD_FRONT_URL:http://localhost:8801}

# Base URL of THIS app, used to build the "Voir ma carte" link to the self-hosted card page.
app.public.url=${APP_PUBLIC_URL:http://localhost:5000}
# Off by default: the card is served locally. Set true to also push to an external vcard-api.
vcard.push.enabled=${VCARD_PUSH_ENABLED:false}
